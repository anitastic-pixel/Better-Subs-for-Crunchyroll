<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Better Subs — Hero</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0a0a12; }
  /* The frame IS the 1280x800 screenshot. Capture this element (or a full-page
     screenshot, since the page is exactly 1280x800). */
  .frame {
    position: relative; width: 1280px; height: 800px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    /* Original abstract "scene" — same palette as the in-app preview, no
       copyrighted content. */
    background:
      radial-gradient(ellipse 55% 60% at 22% 28%, rgba(255,213,74,0.42), transparent 70%),
      radial-gradient(ellipse 48% 52% at 78% 58%, rgba(255,61,110,0.46), transparent 70%),
      radial-gradient(ellipse 60% 60% at 52% 98%, rgba(107,59,255,0.42), transparent 70%),
      radial-gradient(ellipse 42% 45% at 90% 12%, rgba(22,224,168,0.30), transparent 70%),
      radial-gradient(ellipse 55% 58% at 10% 88%, rgba(255,122,31,0.38), transparent 70%),
      linear-gradient(165deg, #1c0930 0%, #060309 100%);
  }
  /* film grain + vignette for depth (matches the in-app look) */
  .frame::after {
    content: ''; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 220px 40px rgba(6,2,14,0.7);
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' seed='7'/><feColorMatrix values='0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 0 0.5 0 0 0 1 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    background-size: 160px 160px; opacity: 0.06; mix-blend-mode: overlay;
  }
  /* bottom scrim so subtitles read against any scene, like a real player */
  .scrim { position: absolute; left: 0; right: 0; bottom: 0; height: 320px;
    background: linear-gradient(to top, rgba(0,0,0,0.55), transparent); }

  .brand { position: absolute; top: 40px; left: 48px; display: flex; align-items: center; gap: 14px; z-index: 3; }
  .brand .name { color: #fff; font-size: 20px; font-weight: 700; letter-spacing: 0.2px; }
  .brand .name span { color: #9aa0b5; font-weight: 600; }

  .headline { position: absolute; top: 150px; left: 0; right: 0; text-align: center; z-index: 3; padding: 0 60px; }
  .headline h1 { color: #fff; font-size: 64px; line-height: 1.08; font-weight: 800; letter-spacing: -1px;
    text-shadow: 0 2px 30px rgba(0,0,0,0.5); }
  .headline h1 .accent { color: #ff6b35; }
  .headline p { margin-top: 18px; color: rgba(255,255,255,0.78); font-size: 23px; font-weight: 500;
    text-shadow: 0 2px 14px rgba(0,0,0,0.5); }

  /* mix-and-match chip */
  .chip { position: absolute; left: 50%; transform: translateX(-50%); bottom: 232px; z-index: 3;
    display: flex; align-items: center; gap: 14px; padding: 9px 18px; border-radius: 999px;
    background: rgba(15,15,30,0.72); border: 1px solid rgba(255,255,255,0.14);
    color: #e7e9f2; font-size: 16px; font-weight: 600; backdrop-filter: blur(8px); }
  .chip b { color: #fff; font-weight: 700; }
  .chip .arrow { color: #ff6b35; font-size: 18px; }
  .chip .dim { color: #9aa0b5; font-weight: 600; }

  /* demo subtitle (rendered via the real engine into #sub) */
  .sub { position: absolute; left: 0; right: 0; bottom: 132px; text-align: center; z-index: 3; }

  /* player-control mock, bottom-right, mirroring Crunchyroll's bar */
  .controls { position: absolute; right: 44px; bottom: 44px; display: flex; align-items: center; gap: 16px; z-index: 4; }
  .btn-sub { display: inline-flex; align-items: center; gap: 6px; background: #ff6b35; color: #fff;
    font-weight: 800; font-size: 16px; letter-spacing: 0.5px; padding: 7px 12px; border-radius: 5px;
    box-shadow: 0 4px 14px rgba(255,107,53,0.4); }
  .cc { width: 38px; height: 30px; border: 2.5px solid #fff; border-radius: 7px; position: relative; opacity: 0.92; }
  .cc::before, .cc::after { content: ''; position: absolute; height: 3px; border-radius: 2px; background: #fff; }
  .cc::before { width: 9px; left: 6px; top: 12px; } .cc::after { width: 13px; left: 18px; top: 12px; }
  .speed { color: #fff; font-weight: 700; font-size: 17px; opacity: 0.9; }
</style>
</head>
<body>
  <div class="frame">
    <div class="scrim"></div>

    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="10" fill="#1a1a2e"/>
        <rect x="15" y="17" width="18" height="6" rx="3" fill="#ff6b35"/>
        <rect x="10" y="27" width="28" height="6" rx="3" fill="#ff6b35"/>
      </svg>
      <div class="name">Better Subs <span>for Crunchyroll</span></div>
    </div>

    <div class="headline">
      <h1>Any subtitles. <span class="accent">Any dub.</span></h1>
      <p>Mix and match the subtitle language with whatever audio you're watching.</p>
    </div>

    <div class="chip">
      <span><span class="dim">Audio</span> &nbsp;<b>日本語</b></span>
      <span class="arrow">→</span>
      <span><span class="dim">Subtitles</span> &nbsp;<b>English</b></span>
    </div>

    <div class="sub" id="sub"></div>

    <div class="controls">
      <span class="btn-sub">EN&nbsp;✓</span>
      <span class="cc"></span>
      <span class="speed">1x</span>
    </div>
  </div>

  <script src="_lib.js"></script>
  <script>
    // Render the demo subtitle with the extension's real outlined-text engine.
    const svg = window.DEMO.createOutlinedTextSvg("I never expected to find you here.", {
      fillColor: 'rgb(255,255,255)', outlineColor: 'rgb(0,0,0)', bord: 2.5,
      fontFamily: "'Trebuchet MS', 'Segoe UI', sans-serif", fontSize: '40px', weight: '600',
      shad: 1, shadOpacity: 0.6,
    });
    document.getElementById('sub').appendChild(svg);
  </script>
</body>
</html>
