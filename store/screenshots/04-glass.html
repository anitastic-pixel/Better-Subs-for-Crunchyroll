<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Better Subs — Glass</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0a0a12; }
  .frame { position: relative; width: 1280px; height: 800px; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background:
      radial-gradient(ellipse 60% 65% at 28% 30%, rgba(120,200,255,0.40), transparent 70%),
      radial-gradient(ellipse 55% 55% at 78% 38%, rgba(255,90,140,0.42), transparent 70%),
      radial-gradient(ellipse 70% 60% at 55% 100%, rgba(120,70,255,0.46), transparent 70%),
      radial-gradient(ellipse 45% 50% at 92% 80%, rgba(255,170,60,0.38), transparent 70%),
      linear-gradient(160deg, #122046 0%, #1a0a2e 55%, #07060f 100%); }
  .frame::after { content: ''; position: absolute; inset: 0; pointer-events: none;
    box-shadow: inset 0 0 220px 40px rgba(6,2,14,0.6); }
  .brand { position: absolute; top: 40px; left: 48px; display: flex; align-items: center; gap: 14px; z-index: 4; }
  .brand .name { color: #fff; font-size: 20px; font-weight: 700; }
  .brand .name span { color: #9aa0b5; font-weight: 600; }
  .headline { position: absolute; top: 132px; left: 0; right: 0; text-align: center; z-index: 4; padding: 0 60px; }
  .headline h1 { color: #fff; font-size: 56px; line-height: 1.06; font-weight: 800; letter-spacing: -0.5px;
    text-shadow: 0 2px 26px rgba(0,0,0,0.5); }
  .headline h1 .accent { color: #ff6b35; }
  .headline p { margin-top: 16px; color: rgba(255,255,255,0.82); font-size: 22px; font-weight: 500;
    text-shadow: 0 2px 14px rgba(0,0,0,0.5); }

  /* frosted-glass subtitle box (the real recipe from lib/cue-style.js buildGlassCss) */
  .glassbox { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); z-index: 4;
    display: inline-block; color: #fff; font-size: 38px; font-weight: 600; line-height: 1.35;
    text-align: center; padding: 14px 34px; border-radius: 16px;
    background: rgba(10,12,26,0.30);
    backdrop-filter: blur(13px) saturate(160%) hue-rotate(0deg) brightness(1.04);
    -webkit-backdrop-filter: blur(13px) saturate(160%) hue-rotate(0deg) brightness(1.04);
    border: 1px solid rgba(255,255,255,0.24);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.32), inset 0 -1px 0 rgba(0,0,0,0.20),
      inset 0 10px 18px -10px rgba(255,255,255,0.18), inset 0 -8px 16px -10px rgba(0,0,0,0.22),
      0 6px 20px rgba(0,0,0,0.38), 0 1px 2px rgba(0,0,0,0.16);
    font-family: 'Trebuchet MS','Segoe UI',sans-serif; }
</style>
</head>
<body>
  <div class="frame">
    <div class="brand">
      <svg width="44" height="44" viewBox="0 0 48 48"><rect width="48" height="48" rx="10" fill="#1a1a2e"/>
        <rect x="15" y="17" width="18" height="6" rx="3" fill="#ff6b35"/><rect x="10" y="27" width="28" height="6" rx="3" fill="#ff6b35"/></svg>
      <div class="name">Better Subs <span>for Crunchyroll</span></div>
    </div>
    <div class="headline">
      <h1>Captions that feel <span class="accent">built-in.</span></h1>
      <p>A frosted-glass panel — adjustable blur, tint, padding, and radius.</p>
    </div>
    <div class="glassbox">Some things you can only say once.</div>
  </div>
</body>
</html>
