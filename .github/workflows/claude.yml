name: claude

# Runs Claude on an issue/PR when someone with write access mentions @claude or
# adds the "claude" label. Public repo → never trigger on plain "opened", or any
# stranger's issue text would drive an agent with write access.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name != 'issues' && contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Bash(node:*),Bash(git:*),Bash(find:*)"
            --append-system-prompt "Read CONTEXT.md first. Before finishing, run: node tools/test-logic.mjs && node tools/test-buildsigns.mjs && node tools/build-iso-bundle.mjs (commit the regenerated extension/lib/iso-bundle.js if it changed). Crunchyroll player behaviour cannot be verified here: end every PR description with a 'Live QA needed' checklist of what to check on a real episode."
